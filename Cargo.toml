[package]
name = "utopia-abuse"
description = "Rate limits: fixed windows, sliding windows and token buckets over Redis, Redis Cluster, pooled connections, document stores and Appwrite tables, and reCAPTCHA verification."
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"

[features]
default = ["redis", "recaptcha"]
# Redis (redis-rs connections) and pooled Redis connections.
redis = ["dep:redis"]
# Redis Cluster (redis-rs cluster client), directly and in pools.
redis-cluster = ["redis", "redis/cluster-async"]
# reCAPTCHA verification over HTTPS (hyper and rustls).
recaptcha = ["dep:bytes", "dep:http-body-util", "dep:hyper", "dep:hyper-rustls", "dep:hyper-util", "dep:rustls"]

[dependencies]
bytes = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", optional = true, features = ["server", "http1", "client"] }
hyper-rustls = { version = "0.27", optional = true, default-features = false, features = ["http1", "ring", "tls12", "webpki-roots"] }
hyper-util = { version = "0.1", optional = true, features = ["tokio", "client-legacy", "http1"] }
php-std = { version = "0.1.0", git = "https://github.com/utopia-rs/php-std" }
redis = { version = "0.32", optional = true, default-features = false, features = ["tokio-comp", "aio", "connection-manager", "script"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "rt"] }

[package.metadata.utopia]
php-sync = "da0119eda7c139b8f99b13d814e5a99f9b5ac418"